[package]
name = "everythux-app"
description = "Everythux: instant file search for Linux (desktop UI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.deb]
name = "everythux"
maintainer = "penCsharpener <noreply@users.noreply.github.com>"
copyright = "2026, the everythux authors"
section = "utils"
priority = "optional"
extended-description = """\
Everythux finds files by name as you type. It indexes mounted ext4 volumes into a local \
SQLite database and searches it in memory. Includes the everythux-cli command-line tool."""
depends = "$auto"
recommends = "poppler-utils, ffmpeg, xdg-utils"
assets = [
    ["target/release/everythux", "usr/bin/", "755"],
    ["target/release/everythux-cli", "usr/bin/", "755"],
    ["../../packaging/everythux.desktop", "usr/share/applications/", "644"],
    ["../../packaging/everythux.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/everythux.png", "644"],
    ["assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/everythux.png", "644"],
    ["assets/icon-32.png", "usr/share/icons/hicolor/32x32/apps/everythux.png", "644"],
    ["../../packaging/io.github.pencsharpener.Everythux.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../README.md", "usr/share/doc/everythux/README.md", "644"],
    ["../../docs/*.md", "usr/share/doc/everythux/", "644"],
]

[[bin]]
name = "everythux"
path = "src/main.rs"

[dependencies]
everythux-core.workspace = true
everythux-index.workspace = true
everythux-platform.workspace = true
everythux-preview.workspace = true
everythux-search.workspace = true
anyhow.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
memchr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
