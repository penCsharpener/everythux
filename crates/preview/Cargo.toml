[package]
name = "everythux-preview"
description = "Preview providers (image, text, PDF, audio, video) for everythux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["image", "audio", "pdf", "video"]
image = ["dep:image"]
audio = ["dep:lofty", "image"]
# PDF via `pdftoppm` (poppler-utils) at runtime.
pdf = ["image"]
# Video thumbnails via `ffmpegthumbnailer`/`ffmpeg` and metadata via `ffprobe` at runtime.
video = ["image", "dep:serde_json", "dep:tempfile"]

[dependencies]
everythux-core.workspace = true
crossbeam-channel.workspace = true
image = { workspace = true, optional = true }
lofty = { workspace = true, optional = true }
md-5.workspace = true
percent-encoding.workspace = true
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
image.workspace = true
tempfile.workspace = true

[[bench]]
name = "text"
harness = false

[lints]
workspace = true
