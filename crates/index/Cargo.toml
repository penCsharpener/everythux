[package]
name = "everythux-index"
description = "Volume discovery, filesystem walker, SQLite store and index jobs for everythux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes `test_utils` (synthetic tree builder) to other crates' tests and benches.
test-utils = ["dep:tempfile"]

[dependencies]
everythux-core.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
rusqlite.workspace = true
# `event` for poll/eventfd in the inotify watcher.
rustix = { workspace = true, features = ["event"] }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
everythux-index = { path = ".", features = ["test-utils"] }
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "walk"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "store"
harness = false
required-features = ["test-utils"]

[lints]
workspace = true
