<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Everythux</title>
  <!-- lens glass: faint warm tint so the icon stays readable on dark and light panels -->
  <circle cx="104" cy="104" r="60" fill="#FFD9A3" fill-opacity="0.45"/>
  <!-- dark outline pass: handle and ring merge into one silhouette -->
  <g fill="none" stroke="#C2620F" stroke-linecap="round">
    <path d="M152 152L212 212" stroke-width="46"/>
    <circle cx="104" cy="104" r="62" stroke-width="40"/>
  </g>
  <!-- orange fill pass -->
  <g fill="none" stroke="#F28C28" stroke-linecap="round">
    <path d="M152 152L212 212" stroke-width="30"/>
    <circle cx="104" cy="104" r="62" stroke-width="24"/>
  </g>
  <!-- lens highlight -->
  <path d="M64 100A42 42 0 0 1 100 64" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round"/>
</svg>
