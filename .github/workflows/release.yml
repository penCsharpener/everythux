name: Release

# Pushing a tag such as v0.1.0 builds the Linux binaries, a tarball, a .deb and SHA256SUMS and
# attaches them to a GitHub release.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Build x86_64 Linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact version; this only bootstraps rustup.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Check that the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "everythux-app") | .version')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match everythux-app version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --profile dist --locked -p everythux-app -p everythux-cli

      - name: Package tarball
        run: |
          name="everythux-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp target/dist/everythux target/dist/everythux-cli "dist/$name/"
          cp -r packaging docs README.md "dist/$name/"
          for f in LICENSE LICENSE-MIT LICENSE-APACHE; do
            if [ -e "$f" ]; then cp "$f" "dist/$name/"; fi
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      # Metadata ([package.metadata.deb]) lives in crates/app/Cargo.toml. The CLI binary is part of
      # another package, which is why the workspace is built first and cargo-deb gets --no-build.
      - name: Package .deb
        run: cargo deb -p everythux-app --profile dist --no-build --output dist/

      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz ./*.deb > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
